# oracle(Ampere A1, arm64, GPU 없음) prod 배포 — GHCR 이미지를 pull만 한다(빌드 안 함).
# Jenkins(A1)가 release 브랜치를 받아 scripts/deploy.sh로 docker rollout 무중단 배포한다(ADR-0015).
#
# - 모든 backend 서비스(api·worker·worker-chat·relay·4 bridge)는 같은 embed-chat-api 이미지.
# - 공개 TLS/도메인은 NPM(Nginx Proxy Manager)이 종단 → 공유 `proxy` 네트워크로 이 스택의 nginx
#   (별칭 embed-chat-web:80)에 포워딩. 그래서 nginx는 호스트 포트를 열지 않는다.
# - 무중단: api·worker·worker-chat만 `docker rollout`(start-first). db·redis·nginx는 싱글톤.
# - ollama·paddle 없음(per-Tenant Provider/Vision OCR). collectstatic 없음(STATIC_ROOT 미사용).
#
# 사전 준비(A1): `docker network create proxy` (NPM과 공유), .env, GHCR login(read:packages).
# 이미지 태그: deploy.sh가 IMAGE_TAG=<git-sha>로 핀(롤백 = 옛 sha 재실행).

x-backend: &backend
  image: ghcr.io/sandcorporation/embed-chat-api:${IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-embed_chat}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    <<: *backend
    # uvicorn ASGI(전면 async, ADR-0022). A1 메모리 제약상 워커 2(async라 워커당 동시 다수 SSE 처리).
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    <<: *backend
    command: celery -A config.celery worker --loglevel=info
    volumes:
      - media:/app/media
    # 배치 드레인 — grace를 넘겨 SIGKILL돼도 재배달로 유실 0이 되려면 backend가 acks_late=True여야
    # 한다(ADR-0015 Q4, 멱등성 감사 후속). 지금은 60s 드레인 여유만 둔다.
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G

  worker-chat:
    <<: *backend
    # taskiq chat 워커(ADR-0024). ListQueueBroker는 pop=소비라 재배달 없음(at-most-once,
    # 비멱등 스트리밍 중복 응답 방지). async라 워커 2 × 동시 25면 충분.
    command: taskiq worker config.taskiq_worker:broker --workers 2 --max-async-tasks 25
    volumes:
      - media:/app/media
    # 진행 중 응답(LLM ~30s)을 마치고 종료하도록 충분히 드레인(SIGTERM 후 신규 수신 중단·완료 대기).
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M

  relay:
    <<: *backend
    command: python manage.py relay
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  worker-webhook:
    <<: *backend
    command: python manage.py consume_events --group=webhook
    deploy:
      resources:
        limits:
          memory: 256M

  worker-visitor-bridge:
    <<: *backend
    command: python manage.py consume_events --group=visitor-bridge
    deploy:
      resources:
        limits:
          memory: 256M

  worker-console-bridge:
    <<: *backend
    command: python manage.py consume_events --group=console-bridge
    deploy:
      resources:
        limits:
          memory: 256M

  worker-presence-bridge:
    <<: *backend
    command: python manage.py consume_events --group=presence-bridge --topic=signals.presence
    deploy:
      resources:
        limits:
          memory: 256M

  # 정적 SPA 빌드 산출물을 볼륨에 복사하고 종료(one-shot). nginx가 그 볼륨을 서빙.
  widget-init:
    image: ghcr.io/sandcorporation/embed-chat-widget:${IMAGE_TAG:-latest}
    volumes:
      - widget_dist:/output
    restart: "no"

  admin-init:
    image: ghcr.io/sandcorporation/embed-chat-admin:${IMAGE_TAG:-latest}
    volumes:
      - admin_dist:/output
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    # 호스트 포트로 노출 → NPM이 <A1 호스트>:${NGINX_PORT}로 포워딩한다(공유 네트워크 불필요).
    # 이 포트는 Oracle 보안목록에 열지 말 것 — 같은 호스트의 NPM만 접근한다.
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend/nginx/nginx.oracle.conf:/etc/nginx/nginx.conf:ro
      - widget_dist:/app/widget:ro
      - admin_dist:/app/admin:ro
    depends_on:
      widget-init:
        condition: service_completed_successfully
      admin-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  widget_dist:
  admin_dist:
  media:
