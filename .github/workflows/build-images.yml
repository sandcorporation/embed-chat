# prod 이미지(arm64) 빌드 → GHCR push → oracle(A1) 무중단 배포 (ADR-0015).
#
# sub의 self-hosted 러너(x86)에서 QEMU buildx로 linux/arm64를 빌드해 oracle(Ampere A1)이
# pull만 하게 한다. 빌드 대상은 backend(api·worker·worker-chat·relay·bridge 공용), admin,
# widget 3개. paddle은 Vision OCR 전환으로 prod에서 제거(ADR-0020), ollama·nginx·pg·redis·
# neo4j는 공식 멀티아치 이미지라 빌드 불필요.
#
# 인증: GITHUB_TOKEN(packages:write) — PAT 불필요. 태그: <git sha>(불변, 배포 핀) + latest(main).
# on: push라 fork PR은 트리거되지 않는다(self-hosted 러너 보안).
#
# release: main push에서 빌드 성공 후 release 브랜치를 그 SHA로 갱신한다. A1의 Jenkins
# (jenkins.moonpair.org)가 release push 웹훅을 받아 로컬에서 scripts/deploy.sh를 실행해
# docker rollout 무중단 배포한다 — SSH·배포 시크릿 불필요(배포가 호스트 네이티브).

name: build-images

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, arm64-builder]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          - image: admin
            context: ./admin
          - image: widget
            context: ./widget
    steps:
      - uses: actions/checkout@v4

      # 호스트 dockerd(DooD)에 arm64 에뮬레이션 등록 + buildx 빌더 준비(매 실행 idempotent).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/embed-chat-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 러너 재시작에도 캐시 보존 — GHCR :buildcache 태그에 layer 캐시 저장/재사용.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/embed-chat-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/embed-chat-${{ matrix.image }}:buildcache,mode=max

  # main push에서 3개 이미지 빌드가 모두 성공하면 release 브랜치를 그 SHA로 force-update한다.
  # 이 push가 GitHub 웹훅을 발화 → A1의 Jenkins가 release를 감지해 로컬 배포한다.
  # (GITHUB_TOKEN push는 다른 GH Actions 워크플로우는 재귀 방지로 안 깨우지만, 외부 웹훅(Jenkins)은
  #  정상 발화한다.) release HEAD = 빌드된 SHA = 이미지 태그라 Jenkins가 그대로 쓴다.
  # 추가 시크릿 불필요 — 내장 GITHUB_TOKEN(contents:write)만 쓴다.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: release 브랜치를 빌드된 SHA로 갱신(웹훅 → Jenkins 배포)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/release" \
            -f sha='${{ github.sha }}' -F force=true \
          || gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref='refs/heads/release' -f sha='${{ github.sha }}'
