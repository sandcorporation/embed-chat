# prod 이미지(arm64) 빌드 → GHCR push → oracle(A1) 무중단 배포 (ADR-0015).
#
# sub의 self-hosted 러너(x86)에서 QEMU buildx로 linux/arm64를 빌드해 oracle(Ampere A1)이
# pull만 하게 한다. 빌드 대상은 backend(api·worker·worker-chat·relay·bridge 공용), admin,
# widget 3개. paddle은 Vision OCR 전환으로 prod에서 제거(ADR-0020), ollama·nginx·pg·redis·
# neo4j는 공식 멀티아치 이미지라 빌드 불필요.
#
# 인증: GITHUB_TOKEN(packages:write) — PAT 불필요. 태그: <git sha>(불변, 배포 핀) + latest(main).
# on: push라 fork PR은 트리거되지 않는다(self-hosted 러너 보안).
#
# deploy: main push에서 빌드 성공 후 SSH로 A1에 접속해 scripts/deploy.sh <sha>를 실행한다
# (docker rollout 무중단). A1은 GHCR에 1회 로그인돼 있어 pull만 하므로 워크플로우가 레지스트리
# 토큰을 넘기지 않는다. SSH 시크릿은 production 환경에 둔다(deploy job 주석 참조).

name: build-images

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, arm64-builder]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          - image: admin
            context: ./admin
          - image: widget
            context: ./widget
    steps:
      - uses: actions/checkout@v4

      # 호스트 dockerd(DooD)에 arm64 에뮬레이션 등록 + buildx 빌더 준비(매 실행 idempotent).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/embed-chat-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 러너 재시작에도 캐시 보존 — GHCR :buildcache 태그에 layer 캐시 저장/재사용.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/embed-chat-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/embed-chat-${{ matrix.image }}:buildcache,mode=max

  # main push에서 3개 이미지 빌드가 모두 성공한 뒤에만 A1에 배포한다. SSH로 접속해 repo를 배포
  # SHA로 checkout하고 scripts/deploy.sh를 호출(거기서 pull→migrate→docker rollout 무중단).
  #
  # 필요한 GitHub 설정(Settings → Environments → production, 또는 Actions secrets/variables):
  #   secrets:
  #     ORACLE_SSH_HOST         A1 공인 IP 또는 도메인
  #     ORACLE_SSH_USER         배포 유저(예: deployer)
  #     ORACLE_SSH_KEY          배포용 SSH 개인키 전문(-----BEGIN ... END-----)
  #     ORACLE_SSH_KNOWN_HOSTS  A1 호스트 공개키 — `ssh-keyscan -p <port> <host>` 결과(MITM 방지)
  #   variables(선택):
  #     ORACLE_SSH_PORT         SSH 포트(기본 22)
  #     ORACLE_DEPLOY_PATH      A1의 repo 경로(기본 /opt/embed-chat)
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to oracle A1 over SSH
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.ORACLE_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.ORACLE_DEPLOY_PATH || '/opt/embed-chat' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # repo를 배포 SHA로 맞춘 뒤(컴포즈·nginx·deploy.sh를 이미지와 lockstep) deploy.sh 실행.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" \
              "set -euo pipefail; \
               cd '$DEPLOY_PATH'; \
               git fetch --quiet origin; \
               git checkout --quiet '$GIT_SHA'; \
               IMAGE_TAG='$GIT_SHA' bash scripts/deploy.sh '$GIT_SHA'"
