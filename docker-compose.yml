services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-embed_chat}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Neo4j는 제거됨(ADR-0021) — GraphRAG는 Postgres+pgvector(GraphStore)로 흡수.

  api:
    build: ./backend
    # uvicorn ASGI(전면 async, ADR-0022) — async ninja view + async SSE generator를 네이티브로
    # 서빙한다. gunicorn gevent 폐기(블로킹-허브 병 원천 제거).
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config.celery worker --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 인터랙티브 chat 전용 taskiq 워커(ADR-0024) — taskiq redis 큐에서 chat_task를 소비한다.
  # 노드가 async라 한 이벤트루프가 동시 다수 chat을 IO 대기 중 yield하며 처리(--max-async-tasks).
  # 무거운 배치(Celery worker)와 프로세스가 분리돼 chat이 굶지 않는다. 처리량은 replica로 확장.
  worker-chat:
    build: ./backend
    command: taskiq worker config.taskiq_worker:broker --workers 2 --max-async-tasks 25
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Event pipeline (Transactional Outbox + EventBus) ─────────────────────────
  # relay는 outbox 순서 보존을 위해 단일 인스턴스(스케일 금지). 소비자는 group별 독립
  # 프로세스라 장애·부하가 격리되고 필요 시 각자 replica로 확장한다(presence-bridge는 150).
  relay:
    build: ./backend
    command: python manage.py relay
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-webhook:
    build: ./backend
    command: python manage.py consume_events --group=webhook
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-visitor-bridge:
    build: ./backend
    command: python manage.py consume_events --group=visitor-bridge
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-console-bridge:
    build: ./backend
    command: python manage.py consume_events --group=console-bridge
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-presence-bridge:
    build: ./backend
    command: python manage.py consume_events --group=presence-bridge --topic=signals.presence
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OCR은 prod에서 per-Tenant Vision Provider로 수행한다(PRD-vision-ocr) — Paddle GPU 서비스는
  # prod에서 제거됐다. dev/test는 결정적 로컬 OCR로 Paddle을 유지한다(docker-compose.dev/test.yml).

volumes:
  postgres_data:
  redis_data:
