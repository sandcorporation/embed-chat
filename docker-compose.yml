services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-embed_chat}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j-test-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./backend
    command: gunicorn config.wsgi:application --worker-class=gevent --workers=4 --bind 0.0.0.0:8000
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config.celery worker --loglevel=info
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # 인터랙티브 chat 전용 워커 — 'chat' 큐만 소비해 무거운 배치(worker)에 굶지 않는다.
  # prefork(프로세스 격리)로 gevent web 워커의 블로킹-허브 문제를 피하고, prefetch=1로
  # 긴 태스크의 head-of-line 블로킹을 막는다. 처리량은 이 서비스의 replica로 확장한다.
  worker-chat:
    build: ./backend
    command: celery -A config.celery worker -Q chat --concurrency=4 --prefetch-multiplier=1 --loglevel=info
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # ── Event pipeline (Transactional Outbox + EventBus) ─────────────────────────
  # relay는 outbox 순서 보존을 위해 단일 인스턴스(스케일 금지). 소비자는 group별 독립
  # 프로세스라 장애·부하가 격리되고 필요 시 각자 replica로 확장한다(presence-bridge는 150).
  relay:
    build: ./backend
    command: python manage.py relay
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-webhook:
    build: ./backend
    command: python manage.py consume_events --group=webhook
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-visitor-bridge:
    build: ./backend
    command: python manage.py consume_events --group=visitor-bridge
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-console-bridge:
    build: ./backend
    command: python manage.py consume_events --group=console-bridge
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-presence-bridge:
    build: ./backend
    command: python manage.py consume_events --group=presence-bridge --topic=signals.presence
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OCR은 prod에서 per-Tenant Vision Provider로 수행한다(PRD-vision-ocr) — Paddle GPU 서비스는
  # prod에서 제거됐다. dev/test는 결정적 로컬 OCR로 Paddle을 유지한다(docker-compose.dev/test.yml).

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
