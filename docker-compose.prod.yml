include:
  - path: docker-compose.yml

services:
  widget-init:
    build:
      context: ./widget
    volumes:
      - widget_dist:/output
    restart: "no"

  admin-init:
    build:
      context: ./admin
    volumes:
      - admin_dist:/output
    restart: "no"

  # Ollama는 prod에서 제거됨 — Oracle A1(ARM·GPU 없음)에서 runtime: nvidia가 동작하지 않고,
  # PLATFORM_DEFAULT_PROVIDERS_ENABLED=False라 플랫폼 기본 ollama 임베딩 폴백도 꺼져 있다.
  # prod 임베딩은 per-Tenant Provider(OpenAI 등, ADR-0012)로 수행한다. dev/test는 ollama 유지.

  api:
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    deploy:
      resources:
        limits:
          memory: 512M

  worker-chat:
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/staticfiles:/app/staticfiles:ro
      - widget_dist:/app/widget:ro
      - admin_dist:/app/admin:ro
    depends_on:
      widget-init:
        condition: service_completed_successfully
      admin-init:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  widget_dist:
  admin_dist:
