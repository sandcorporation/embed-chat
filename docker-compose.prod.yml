include:
  - path: docker-compose.yml

services:
  widget-init:
    build:
      context: ./widget
    volumes:
      - widget_dist:/output
    restart: "no"

  admin-init:
    build:
      context: ./admin
    volumes:
      - admin_dist:/output
    restart: "no"

  ollama:
    image: ollama/ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_FLASH_ATTENTION=0
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [ "pull", "bge-m3" ]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker-chat:
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  neo4j:
    restart: unless-stopped
    # 컨테이너 메모리 한도만 걸면 Neo4j(JVM)는 호스트 가용메모리를 보고 page cache를 키워
    # 한도를 넘겨 OOM-kill 된다. JVM 힙·page cache를 한도 아래로 명시한다(heap+pagecache+
    # off-heap/overhead < limit). heap initial=max로 GC 리사이즈 일시정지를 피한다(Neo4j 권장).
    environment:
      NEO4J_server_memory_heap_initial__size: 1536m
      NEO4J_server_memory_heap_max__size: 1536m
      NEO4J_server_memory_pagecache_size: 1g
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '3.0'   # 4코어 공유 환경에서 무거운 그래프 쿼리가 앱 계층을 완전히 굶기지 않게
        reservations:
          memory: 2G

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/staticfiles:/app/staticfiles:ro
      - widget_dist:/app/widget:ro
      - admin_dist:/app/admin:ro
    depends_on:
      widget-init:
        condition: service_completed_successfully
      admin-init:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  widget_dist:
  admin_dist:
  ollama_data:
