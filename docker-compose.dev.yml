include:
  - path: docker-compose.yml

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    # uvicorn ASGI + --reload(코드 변경 핫리로드) — async view·SSE를 dev에서도 네이티브로.
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    command: celery -A config.celery worker --loglevel=debug --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: http://ollama:11434

  # taskiq chat 워커(dev) — chat 코드 변경 시 컨테이너 재시작 필요(taskiq 핫리로드 미사용).
  worker-chat:
    command: taskiq worker config.taskiq_worker:broker --workers 1 --max-async-tasks 10 --log-level DEBUG
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # ── Event pipeline (dev: 코드 마운트 + dev 설정) ──────────────────────────────
  relay:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
  worker-webhook:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
  worker-visitor-bridge:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
  worker-console-bridge:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
  worker-presence-bridge:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

  widget:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./widget:/app
      - widget_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5174"
    depends_on:
      - api

  ollama:
    image: ollama/ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_FLASH_ATTENTION=0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-init:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [ "pull", "bge-m3" ]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # OCR은 prod에서 per-Tenant Vision Provider로 옮겼으나(PRD-vision-ocr), dev는 결정적 로컬
  # OCR 폴백으로 Paddle을 유지한다(OCR 미설정 테넌트도 문서 OCR이 되게 + 통합 테스트 실제 객체).
  paddle-ocr:
    build:
      context: ./paddle_service
      dockerfile: Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - paddle_models:/root/.paddleocr
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\"" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  widget_node_modules:
  admin_node_modules:
  ollama_data:
  paddle_models:
