include:
  - path: docker-compose.yml

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    command: celery -A config.celery worker --loglevel=debug --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: http://ollama:11434

  worker-chat:
    command: celery -A config.celery worker -Q chat --concurrency=2 --prefetch-multiplier=1 --loglevel=debug
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  widget:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./widget:/app
      - widget_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5174"
    depends_on:
      - api

  ollama:
    image: ollama/ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_FLASH_ATTENTION=0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-init:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [ "pull", "bge-m3" ]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  widget_node_modules:
  admin_node_modules:
  ollama_data:
