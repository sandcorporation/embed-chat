# Langfuse v3 셀프호스트 스택 (A1) — 토큰/트레이스 관찰(PRD-langfuse-token-tracking, issue 186).
# 운영 pg/redis와 분리된 전용 데이터스토어(postgres·redis·clickhouse·minio)를 쓴다.
#
# 사용: docker compose -f docker-compose.langfuse.yml --env-file langfuse.env up -d
# 시크릿(langfuse.env, git 제외): LANGFUSE_PG_PASSWORD·CLICKHOUSE_PASSWORD·MINIO_ROOT_PASSWORD·
#   NEXTAUTH_SECRET·SALT·ENCRYPTION_KEY(64 hex)·LANGFUSE_INIT_*(초기 org/유저·API 키).
# 앱(api)은 .env의 LANGFUSE_HOST=http://langfuse-web:3000 + PUBLIC/SECRET_KEY로 연결한다
# (같은 prod 네트워크에 두거나 NPM 별도 호스트로 UI 노출 — 오퍼레이터 전용).
#
# ⚠️ HITL: A1에 기동·NPM·초기 셋업·스모크는 수동 검증 필요.

services:
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
    env_file: langfuse.env
    environment: &langfuse-env
      # ⚠️ Node 힙 상한 — 미설정 시 V8이 컨테이너 메모리의 절반(~512MB)으로 잡아 init 중 힙 OOM.
      NODE_OPTIONS: "--max-old-space-size=1536"
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_PG_PASSWORD}@langfuse-postgres:5432/langfuse
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"   # NPM이 이 포트로 오퍼레이터에게만 노출
    deploy:
      resources:
        limits:
          memory: 2G

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
    env_file: langfuse.env
    environment: *langfuse-env
    deploy:
      resources:
        limits:
          memory: 2G

  langfuse-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  langfuse-minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  langfuse_pg:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio:
